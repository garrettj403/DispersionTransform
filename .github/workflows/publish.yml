name: publish

# Publish to PyPI when a version tag (e.g., v0.1.0) is pushed.
# Uses PyPI trusted publishing: no API token needed, but the publisher must be
# configured on PyPI first (project settings -> Publishing).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Check tag matches package version
        run: |
          version=$(python -c "import ast; t = ast.parse(open('disptrans.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match disptrans.__version__ (${version})"
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl pytest scipy scikit-rf
      - name: Test installed package
        run: |
          mkdir run && cp test_disptrans.py run/ && cd run
          python -c "import disptrans; print(disptrans.__file__)"
          pytest -v test_disptrans.py

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/disptrans
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
